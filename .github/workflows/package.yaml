name: Package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Verify runtime dependency boundary
        run: >-
          node -e "const manifest = require('./packages/profanity-kit/package.json');
          if (Object.keys(manifest.dependencies ?? {}).length > 0)
          throw new Error('The publishable package must not have runtime dependencies')"

      - name: Pack package
        run: pnpm --filter profanity-kit pack --pack-destination artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profanity-kit-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7
